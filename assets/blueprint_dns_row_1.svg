<svg width="800" height="40" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172a45" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#172a45" />
    </pattern>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020c1b" flood-opacity="0.8"/>
    </filter>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0a192f" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <rect x="20" y="0" width="760" height="35" fill="#112240" fill-opacity="0.6" stroke="#8892b0" stroke-opacity="0.4" stroke-width="1" rx="6" />
  <text x="40" y="22" font-family="sans-serif" font-size="14" fill="#e6f1ff">email</text>
  <rect x="230" y="9" width="60" height="18" fill="#BC8CFF" fill-opacity="0.2" rx="4"/>
  <text x="260" y="22" font-family="monospace" font-size="12" fill="#BC8CFF" text-anchor="middle">MX</text>
  <text x="310" y="22" font-family="monospace" font-size="12" fill="#e6f1ff">mailto:adithyams93@outlook.com</text>
  <circle cx="700" cy="17" r="4" fill="#27C93F"/><text x="715" y="22" font-family="sans-serif" font-size="12" fill="#8892b0">Active</text>
  <style>rect:hover { stroke: #64ffda; }</style>
</svg>