<svg width="400" height="140" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172a45" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#172a45" />
    </pattern>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020c1b" flood-opacity="0.8"/>
    </filter>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  
  <rect x="15" y="10" width="370" height="120" fill="#112240" fill-opacity="0.9" stroke="#172a45" stroke-width="2" rx="10" filter="url(#drop-shadow)"/>
  <circle cx="45" cy="40" r="16" fill="none" stroke="#64ffda" stroke-width="2"/>
  <circle cx="45" cy="40" r="6" fill="#64ffda" filter="url(#neon-glow)"/>
  <text x="75" y="45" font-family="monospace" font-size="18" fill="#e6f1ff" font-weight="bold">wisebiz-gitops</text>
  <text x="35" y="80" font-family="sans-serif" font-size="13" fill="#8892b0">Automated deployment with ArgoCD</text>
  <rect x="35" y="100" width="10" height="10" fill="#64ffda" rx="2"/>
  <text x="55" y="110" font-family="monospace" font-size="11" fill="#64ffda" letter-spacing="1">ACTIVE DEPLOYMENT</text>
  <style>rect:hover { stroke: #64ffda; }</style>
</svg>