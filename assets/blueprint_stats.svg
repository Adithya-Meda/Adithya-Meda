<svg width="800" height="174" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172a45" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#172a45" />
    </pattern>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020c1b" flood-opacity="0.8"/>
    </filter>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0a192f" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <rect x="20" y="2" width="760" height="170" fill="#112240" stroke="#172a45" stroke-width="2" rx="12" filter="url(#drop-shadow)"/>
  <text x="40" y="15" font-family="sans-serif" font-size="14" fill="#8892b0" font-weight="bold" letter-spacing="1">GITHUB STATS</text>
  <g transform="translate(40, 52)">
    <text x="0" y="10" font-family="sans-serif" font-size="12" fill="#8892b0">Total Commits</text>
    <text x="0" y="45" font-family="monospace" font-size="32" fill="#e6f1ff" font-weight="bold">61</text>
    <path d="M 120 40 C 135 40, 140 20, 155 20 C 170 20, 175 10, 190 10 C 205 10, 210 30, 225 30 L 225 50 L 120 50 Z" fill="url(#chart-grad)"/>
    <path d="M 120 40 C 135 40, 140 20, 155 20 C 170 20, 175 10, 190 10 C 205 10, 210 30, 225 30" fill="none" stroke="#64ffda" stroke-width="2"/>
  </g>
  <g transform="translate(290, 52)">
    <text x="0" y="10" font-family="sans-serif" font-size="12" fill="#8892b0">Total PRs</text>
    <text x="0" y="45" font-family="monospace" font-size="32" fill="#e6f1ff" font-weight="bold">1</text>
    <path d="M 140 30 C 155 30, 160 40, 175 40 C 190 40, 195 10, 210 10 C 225 10, 230 20, 245 20 L 245 50 L 140 50 Z" fill="url(#chart-grad)"/>
    <path d="M 140 30 C 155 30, 160 40, 175 40 C 190 40, 195 10, 210 10 C 225 10, 230 20, 245 20" fill="none" stroke="#64ffda" stroke-width="2"/>
  </g>
  <g transform="translate(620, 87)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#172a45" stroke-width="6"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#64ffda" stroke-width="6" stroke-dasharray="188" stroke-dashoffset="40" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="188" to="40" dur="2s" fill="freeze"/>
    </circle>
    <text x="0" y="5" font-family="monospace" font-size="20" fill="#e6f1ff" font-weight="bold" text-anchor="middle">0</text>
    <text x="0" y="50" font-family="sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">Total Issues</text>
  </g>
</svg>