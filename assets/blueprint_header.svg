<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172a45" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#172a45" />
    </pattern>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020c1b" flood-opacity="0.8"/>
    </filter>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0a192f" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  
  <rect x="20" y="20" width="760" height="240" fill="none" stroke="#8892b0" stroke-width="1" stroke-dasharray="10,5" rx="12"/>
  <rect x="40" y="10" width="91" height="20" fill="#0a192f"/>
  <text x="50" y="25" font-family="sans-serif" font-size="12" fill="#8892b0" font-weight="bold">REGION: India</text>

  <path id="data-path" d="M 180 90 C 220 90, 220 150, 270 150" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="4,4"/>
  <circle r="4" fill="#fff" filter="url(#neon-glow)">
    <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#data-path"/></animateMotion>
  </circle>

  <g transform="translate(40, 60)" filter="url(#drop-shadow)">
    <rect width="140" height="60" fill="#112240" stroke="#64ffda" stroke-width="1" rx="8"/>
    <circle cx="20" cy="30" r="6" fill="none" stroke="#64ffda" stroke-width="2"/>
    <circle cx="20" cy="30" r="2" fill="#64ffda"/>
    <text x="40" y="27" font-family="sans-serif" font-size="10" fill="#8892b0">INGRESS ROUTER</text>
    <text x="40" y="45" font-family="monospace" font-size="14" fill="#e6f1ff" font-weight="bold">App ALB</text>
  </g>

  <g transform="translate(270, 80)" filter="url(#drop-shadow)">
    <rect width="320" height="140" fill="#112240" stroke="#64ffda" stroke-width="2" rx="12" />
    <circle cx="15" cy="15" r="4" fill="#FF5F56"/>
    <circle cx="30" cy="15" r="4" fill="#FFBD2E"/>
    <circle cx="45" cy="15" r="4" fill="#27C93F"/>
    <text x="160" y="45" font-family="sans-serif" font-size="24" fill="#e6f1ff" font-weight="bold" text-anchor="middle">Senior DevOps Engineer</text>
    <text x="160" y="70" font-family="monospace" font-size="12" fill="#64ffda" text-anchor="middle">&lt; Automating Infrastructure at Scale /&gt;</text>
    
    <circle cx="160" cy="105" r="14" fill="none" stroke="#172a45" stroke-width="3"/>
    <circle cx="160" cy="105" r="14" fill="none" stroke="#64ffda" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="80;0;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="105" r="6" fill="#64ffda" filter="url(#neon-glow)"/>
  </g>

  <path id="db-path" d="M 590 150 C 640 150, 640 110, 670 110" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="4,4"/>
  <circle r="4" fill="#fff" filter="url(#neon-glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#db-path"/></animateMotion>
  </circle>

  <g transform="translate(670, 80)" filter="url(#drop-shadow)">
    <path d="M 0 15 Q 40 -5 80 15 L 80 55 Q 40 75 0 55 Z" fill="#112240" stroke="#64ffda" stroke-width="2"/>
    <path d="M 0 15 Q 40 35 80 15" fill="none" stroke="#64ffda" stroke-width="2"/>
    <text x="40" y="45" font-family="monospace" font-size="12" fill="#e6f1ff" font-weight="bold" text-anchor="middle">Brain.db</text>
  </g>
</svg>