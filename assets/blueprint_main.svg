<svg width="800" height="840" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172a45" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#172a45" />
    </pattern>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#020c1b" flood-opacity="0.8"/>
    </filter>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0a192f" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  
  <!-- ================= HEADER (0 - 280) ================= -->
  <g transform="translate(0, 0)">
    <rect x="20" y="20" width="760" height="240" fill="none" stroke="#8892b0" stroke-width="1" stroke-dasharray="10,5" rx="12"/>
    <rect x="40" y="10" width="212" height="20" fill="#0a192f"/>
    <text x="50" y="25" font-family="sans-serif" font-size="12" fill="#8892b0" font-weight="bold">REGION: India ----------</text>
    
    <g transform="translate(0, 40)">
      <path id="data-path" d="M 180 50 C 220 50, 220 110, 270 110" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="210" cy="80" r="4" fill="#ffffff" filter="url(#drop-shadow)"/>
      
      <g transform="translate(40, 20)" filter="url(#drop-shadow)">
        <rect width="140" height="70" fill="#112240" stroke="#64ffda" stroke-width="1" rx="8"/>
        <circle cx="20" cy="20" r="6" fill="none" stroke="#64ffda" stroke-width="2"/>
        <circle cx="20" cy="20" r="2" fill="#64ffda"/>
        <text x="40" y="23" font-family="sans-serif" font-size="10" fill="#8892b0">INGRESS ROUTER</text>
        <text x="40" y="41" font-family="monospace" font-size="14" fill="#e6f1ff" font-weight="bold">App ALB</text>
      </g>
      
      <g transform="translate(270, 40)" filter="url(#drop-shadow)">
        <rect width="320" height="120" fill="#112240" stroke="#64ffda" stroke-width="2" rx="8"/>
        <circle cx="20" cy="20" r="4" fill="#FF5F56"/>
        <circle cx="35" cy="20" r="4" fill="#FFBD2E"/>
        <circle cx="50" cy="20" r="4" fill="#27C93F"/>
        <text x="160" y="55" font-family="sans-serif" font-size="28" fill="#e6f1ff" font-weight="bold" text-anchor="middle">Adithya-Meda</text>
        <text x="160" y="85" font-family="monospace" font-size="14" fill="#64ffda" font-weight="bold" text-anchor="middle">&lt; Automating Infrastructure at Scale /&gt;</text>
        <circle cx="160" cy="120" r="10" fill="#64ffda" opacity="0.3"/>
        <circle cx="160" cy="120" r="5" fill="#64ffda"/>
      </g>
      
      <path id="data-path-out" d="M 590 110 C 640 110, 640 50, 680 50" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="4,4"/>
      <circle cx="615" cy="80" r="4" fill="#ffffff" filter="url(#drop-shadow)"/>
      <g transform="translate(670, 30)" filter="url(#drop-shadow)">
        <path d="M 0 20 Q 40 0 80 20 L 80 60 Q 40 80 0 60 Z" fill="#112240" stroke="#64ffda" stroke-width="1"/>
        <path d="M 0 20 Q 40 40 80 20" fill="none" stroke="#64ffda" stroke-width="1"/>
        <text x="40" y="45" font-family="monospace" font-size="12" fill="#e6f1ff" font-weight="bold" text-anchor="middle">Brain.db</text>
      </g>
    </g>
  </g>

  <!-- ================= PHILOSOPHY (280 - 460) ================= -->
  <g transform="translate(0, 280)">
    <rect x="20" y="20" width="760" height="140" fill="#112240" fill-opacity="0.8" stroke="#172a45" stroke-width="1" rx="8"/>
    <text x="40" y="45" font-family="sans-serif" font-size="12" fill="#8892b0" font-weight="bold" letter-spacing="1">CONFIGMAP: ENGINEERING_PHILOSOPHY.YAML</text>
    <g font-family="monospace" font-size="14" fill="#e6f1ff" transform="translate(40, 80)">
      <text y="0"><tspan fill="#FFBD2E">apiVersion:</tspan> v1</text>
      <text y="20"><tspan fill="#FFBD2E">kind:</tspan> CoreValues</text>
      <text y="40"><tspan fill="#FFBD2E">data:</tspan></text>
      <text y="60">  <tspan fill="#64ffda">automation:</tspan> "Everything as Code"</text>
      <text y="80">  <tspan fill="#64ffda">security:</tspan> "Shift-Left &amp; Zero Trust"</text>
    </g>
  </g>

  <!-- ================= SKILLS (460 - 640) ================= -->
  <g transform="translate(0, 460)">
    <text x="400" y="25" font-family="sans-serif" font-size="12" fill="#8892b0" font-weight="bold" letter-spacing="2" text-anchor="middle">TECH STACK TOPOLOGY (SUBNETS)</text>
    <line x1="100" y1="130" x2="700" y2="130" stroke="#8892b0" stroke-width="2" stroke-dasharray="5,5"/>

    <path d="M 150 75 C 150 90, 150 130, 150 130" fill="none" stroke="#64ffda" stroke-width="2"/>
    <circle cx="150" cy="130" r="4" fill="#64ffda">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(100, 45)" filter="url(#drop-shadow)">
      <rect width="100" height="30" fill="#112240" stroke="#64ffda" stroke-width="1" rx="15">
        <animate attributeName="stroke-width" values="1;3;1" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#64ffda;#ffffff;#64ffda" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="20" font-family="monospace" font-size="12" fill="#e6f1ff" font-weight="bold" text-anchor="middle">AWS</text>
    </g>
    <path d="M 270 105 C 270 120, 270 130, 270 130" fill="none" stroke="#64ffda" stroke-width="2"/>
    <circle cx="270" cy="130" r="4" fill="#64ffda">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(220, 75)" filter="url(#drop-shadow)">
      <rect width="100" height="30" fill="#112240" stroke="#64ffda" stroke-width="1" rx="15">
        <animate attributeName="stroke-width" values="1;3;1" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#64ffda;#ffffff;#64ffda" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="20" font-family="monospace" font-size="12" fill="#e6f1ff" font-weight="bold" text-anchor="middle">Kubernetes</text>
    </g>
    <path d="M 390 75 C 390 90, 390 130, 390 130" fill="none" stroke="#64ffda" stroke-width="2"/>
    <circle cx="390" cy="130" r="4" fill="#64ffda">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(340, 45)" filter="url(#drop-shadow)">
      <rect width="100" height="30" fill="#112240" stroke="#64ffda" stroke-width="1" rx="15">
        <animate attributeName="stroke-width" values="1;3;1" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#64ffda;#ffffff;#64ffda" dur="2.1s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="20" font-family="monospace" font-size="12" fill="#e6f1ff" font-weight="bold" text-anchor="middle">Terraform</text>
    </g>
    <path d="M 510 105 C 510 120, 510 130, 510 130" fill="none" stroke="#64ffda" stroke-width="2"/>
    <circle cx="510" cy="130" r="4" fill="#64ffda">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(460, 75)" filter="url(#drop-shadow)">
      <rect width="100" height="30" fill="#112240" stroke="#64ffda" stroke-width="1" rx="15">
        <animate attributeName="stroke-width" values="1;3;1" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#64ffda;#ffffff;#64ffda" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="20" font-family="monospace" font-size="12" fill="#e6f1ff" font-weight="bold" text-anchor="middle">Docker</text>
    </g>
    <path d="M 630 75 C 630 90, 630 130, 630 130" fill="none" stroke="#64ffda" stroke-width="2"/>
    <circle cx="630" cy="130" r="4" fill="#64ffda">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(580, 45)" filter="url(#drop-shadow)">
      <rect width="100" height="30" fill="#112240" stroke="#64ffda" stroke-width="1" rx="15">
        <animate attributeName="stroke-width" values="1;3;1" dur="2.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#64ffda;#ffffff;#64ffda" dur="2.7s" repeatCount="indefinite"/>
      </rect>
      <text x="50" y="20" font-family="monospace" font-size="12" fill="#e6f1ff" font-weight="bold" text-anchor="middle">CI/CD</text>
    </g>
  </g>

  <!-- ================= STATS (640 - 840) ================= -->
  <g transform="translate(0, 640)">
    <rect x="20" y="10" width="760" height="170" fill="#112240" stroke="#172a45" stroke-width="2" rx="12" filter="url(#drop-shadow)"/>
    <text x="40" y="35" font-family="sans-serif" font-size="14" fill="#8892b0" font-weight="bold" letter-spacing="1">GITHUB STATS</text>
    
    <g transform="translate(40, 60)">
      <text x="0" y="10" font-family="sans-serif" font-size="12" fill="#8892b0">Total Commits</text>
      <text x="0" y="45" font-family="monospace" font-size="32" fill="#e6f1ff" font-weight="bold">64</text>
      <path d="M 120 40 C 135 40, 140 20, 155 20 C 170 20, 175 10, 190 10 C 205 10, 210 30, 225 30 L 225 50 L 120 50 Z" fill="url(#chart-grad)"/>
      <path d="M 120 40 C 135 40, 140 20, 155 20 C 170 20, 175 10, 190 10 C 205 10, 210 30, 225 30" fill="none" stroke="#64ffda" stroke-width="2"/>
    </g>
    
    <g transform="translate(290, 60)">
      <text x="0" y="10" font-family="sans-serif" font-size="12" fill="#8892b0">Total PRs</text>
      <text x="0" y="45" font-family="monospace" font-size="32" fill="#e6f1ff" font-weight="bold">1</text>
      <path d="M 140 30 C 155 30, 160 40, 175 40 C 190 40, 195 10, 210 10 C 225 10, 230 20, 245 20 L 245 50 L 140 50 Z" fill="url(#chart-grad)"/>
      <path d="M 140 30 C 155 30, 160 40, 175 40 C 190 40, 195 10, 210 10 C 225 10, 230 20, 245 20" fill="none" stroke="#64ffda" stroke-width="2"/>
    </g>
    
    <g transform="translate(620, 95)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#172a45" stroke-width="6"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#64ffda" stroke-width="6" stroke-dasharray="188" stroke-dashoffset="40" stroke-linecap="round"/>
      <text x="0" y="5" font-family="monospace" font-size="20" fill="#e6f1ff" font-weight="bold" text-anchor="middle">0</text>
      <text x="0" y="50" font-family="sans-serif" font-size="12" fill="#8892b0" text-anchor="middle">Total Issues</text>
    </g>
  </g>

</svg>