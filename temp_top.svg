<svg width="800" height="540" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172a45" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0a192f" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  
  <!-- HEADER BLOCK (0-280) -->
  <rect x="20" y="20" width="760" height="240" fill="none" stroke="#8892b0" stroke-width="1" stroke-dasharray="10,5" rx="12"/>
  <rect x="40" y="10" width="140" height="20" fill="#0a192f"/>
  <text x="50" y="25" font-family="sans-serif" font-size="12" fill="#8892b0" font-weight="bold">REGION: India</text>
  
  <g transform="translate(0, 40)">
    <path id="data-path" d="M 180 50 C 220 50, 220 110, 270 110" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="210" cy="80" r="4" fill="#ffffff" filter="url(#drop-shadow)"/>
    <g transform="translate(40, 20)" filter="url(#drop-shadow)">
      <rect width="140" height="70" fill="#112240" stroke="#64ffda" stroke-width="1" rx="8"/>
      <circle cx="20" cy="20" r="6" fill="none" stroke="#64ffda" stroke-width="2"/>
      <circle cx="20" cy="20" r="2" fill="#64ffda"/>
      <text x="40" y="23" font-family="sans-serif" font-size="10" fill="#8892b0">INGRESS ROUTER</text>
      <text x="40" y="41" font-family="monospace" font-size="14" fill="#ccd6f6" font-weight="bold">App ALB</text>
    </g>
    
    <g transform="translate(270, 40)" filter="url(#drop-shadow)">
      <rect width="320" height="120" fill="#112240" stroke="#64ffda" stroke-width="2" rx="8"/>
      <circle cx="20" cy="20" r="4" fill="#FF5F56"/>
      <circle cx="35" cy="20" r="4" fill="#FFBD2E"/>
      <circle cx="50" cy="20" r="4" fill="#27C93F"/>
      <text x="160" y="55" font-family="sans-serif" font-size="28" fill="#ccd6f6" font-weight="bold" text-anchor="middle">Adithya M S</text>
      <text x="160" y="85" font-family="monospace" font-size="14" fill="#64ffda" font-weight="bold" text-anchor="middle">< Automating Infrastructure at Scale /></text>
      <circle cx="160" cy="120" r="10" fill="#64ffda" opacity="0.3"/>
      <circle cx="160" cy="120" r="5" fill="#64ffda"/>
    </g>
    
    <path id="data-path-out" d="M 590 110 C 640 110, 640 50, 680 50" fill="none" stroke="#64ffda" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="615" cy="80" r="4" fill="#ffffff" filter="url(#drop-shadow)"/>
    <g transform="translate(670, 30)" filter="url(#drop-shadow)">
      <path d="M 0 20 Q 40 0 80 20 L 80 60 Q 40 80 0 60 Z" fill="#112240" stroke="#64ffda" stroke-width="1"/>
      <path d="M 0 20 Q 40 40 80 20" fill="none" stroke="#64ffda" stroke-width="1"/>
      <text x="40" y="45" font-family="monospace" font-size="12" fill="#ccd6f6" font-weight="bold" text-anchor="middle">Brain.db</text>
    </g>
  </g>

  <!-- PHILOSOPHY BLOCK (280-460) -->
  <g transform="translate(0, 280)">
    <rect x="20" y="20" width="760" height="140" fill="#112240" fill-opacity="0.8" stroke="#64ffda" stroke-width="1" rx="8"/>
    <text x="40" y="45" font-family="sans-serif" font-size="12" fill="#8892b0" font-weight="bold" letter-spacing="1">CONFIGMAP: ENGINEERING_PHILOSOPHY.YAML</text>
    <g font-family="monospace" font-size="14" fill="#ccd6f6" transform="translate(40, 80)">
      <text x="0" y="0"><tspan fill="#FFBD2E">apiVersion:</tspan> v1</text>
      <text x="0" y="25"><tspan fill="#FFBD2E">kind:</tspan> CoreValues</text>
      <text x="0" y="50"><tspan fill="#FFBD2E">data:</tspan></text>
      <text x="0" y="75"><tspan fill="#64ffda">automation:</tspan> "Everything as Code"</text>
      <text x="0" y="100"><tspan fill="#64ffda">security:</tspan> "Shift-Left & Zero Trust"</text>
    </g>
  </g>

  <!-- DNS HEADER BLOCK (460-540) -->
  <g transform="translate(0, 460)">
    <text x="40" y="35" font-family="sans-serif" font-size="14" fill="#8892b0" font-weight="bold" letter-spacing="1">ROUTE53 DNS RECORDS (CONTACTS &amp; CERTS)</text>
    <line x1="20" y1="50" x2="780" y2="50" stroke="#172a45" stroke-width="2"/>
    <text x="40" y="70" font-family="monospace" font-size="12" fill="#8892b0" font-weight="bold">RECORD NAME</text>
    <text x="230" y="70" font-family="monospace" font-size="12" fill="#8892b0" font-weight="bold">TYPE</text>
    <text x="310" y="70" font-family="monospace" font-size="12" fill="#8892b0" font-weight="bold">ROUTING VALUE</text>
    <text x="700" y="70" font-family="monospace" font-size="12" fill="#8892b0" font-weight="bold">STATUS</text>
  </g>

</svg>